<!DOCTYPE html>
<html lang="de" style="height: 100%;">
<head>
    <title>LunarByteWorks</title>
    <link href="general.css" rel="stylesheet"/>
    <script>
        window.onload = function() {
            let department = window.location.pathname;
            {
                let firstSlash = department.indexOf("/");
                if (firstSlash === -1) {
                    navigation.navigate("/");
                    return;
                }
                let lastSlash = department.lastIndexOf("/");
                let end = department.length;
                if (firstSlash !== lastSlash) end = lastSlash;
                department = department.substring(firstSlash + 1, end).trim().toLowerCase();
            }
            let target = document.getElementById("include-html-root");
            const xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function() {
                if (this.readyState !== 4) return;
                if (this.status === 200) target.innerHTML = this.responseText;
                if (this.status === 404) target.innerHTML = "Department Not Found";
            }
            xhr.open("GET", "departments/" + department + ".html", true);
            xhr.send();
            switch (department) {
                case "gaming": document.body.style.setProperty("--colorscheme", "var(--glow-orange)"); break;
                case "highlevel": document.body.style.setProperty("--colorscheme", "var(--glow-purple)"); break;
            }
        }
    </script>
</head>
<body style="
    --colorscheme: var(--glow-yellow);
    background-color: var(--d-surface);
    color: var(--d-on-surface);
">
<header>
    <h1>LunarByteWorks</h1>
    <div style="
        height: 3px;
        background-color: var(--colorscheme);
    "></div>
</header>
<div id="include-html-root"></div>
</body>
</html>
